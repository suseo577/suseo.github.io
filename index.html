<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suseo Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #06000c;
      --purple: #8b2fe0;
      --violet: #b45cff;
      --pink: #ff5fb8;
      --soft: #f6e8ff;
      --muted: #c9a6e6;
      --pixel: "Pixelify Sans", "Courier New", monospace;
      --body: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh;
      color: var(--soft); font-family: var(--body); line-height: 1.5;
      background:
        radial-gradient(ellipse at 50% -10%, rgba(139, 47, 224, .45), transparent 60%),
        var(--black);
    }
    :focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }

    .page { max-width: 575px; margin: 0 auto; padding: 0 1rem 4rem; }

    .banner {
      height: 150px;
      border: 3px solid var(--purple); border-top: 0;
      border-radius: 0 0 28px 28px;
      background:
        linear-gradient(rgba(255, 95, 184, .35) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255, 95, 184, .35) 2px, transparent 2px),
        linear-gradient(180deg, #3a0f66, #12001f);
      background-size: 36px 36px, 36px 36px, auto;
    }

    .profile { text-align: center; margin-top: -75px; }
    .avatar {
      display: block; width: 150px; height: 150px; margin: 0 auto 1rem;
      border-radius: 50%; object-fit: cover; background: var(--black);
      border: 4px solid var(--pink);
      box-shadow: 0 0 0 4px var(--black), 0 0 28px rgba(180, 92, 255, .6);
    }
    h1 { font-family: var(--pixel); font-size: 2.2rem; line-height: 1.15; margin: 0 0 .4rem; color: var(--violet); }
    .intro { max-width: 40ch; margin: 0 auto 2rem; color: var(--muted); }

    .links { display: flex; flex-direction: column; gap: .9rem; }
    .btn {
      display: block; text-align: center; text-decoration: none;
      padding: 1rem 1.25rem; border-radius: 16px;
      border: 2px solid rgba(180, 92, 255, .5);
      background: rgba(30, 8, 50, .8); color: var(--soft);
      font-family: var(--pixel); font-size: 1.25rem; font-weight: 700;
      transition: transform .12s, border-color .12s, box-shadow .12s;
    }
    .btn:hover { transform: translateY(-3px); border-color: var(--pink); box-shadow: 0 8px 24px rgba(255, 95, 184, .25); }
    .btn.featured {
      padding: 1.4rem 1.25rem; border: 0; color: #fff; font-size: 1.5rem;
      background: linear-gradient(135deg, #6d1fc4, #d6379a);
      box-shadow: 0 10px 30px rgba(139, 47, 224, .45);
    }
    .btn small { display: block; margin-top: .15rem; font-family: var(--body); font-size: .9rem; font-weight: 400; }

    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:hover { transform: none; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="banner"></div>

    <div class="profile">
      <!-- logo.png must sit next to this index.html -->
      <img class="avatar" src="logo.png" width="150" height="150" alt="Susie from Deltarune">
      <h1>Suseo Web</h1>
      <p class="intro">Welcome to the amazing digital web of Suseo or Susie from Deltarune.</p>
    </div>

    <nav class="links" aria-label="Links">
      <a class="btn featured" href="https://youtube.com/@suseo-.0?si=DFY8polfTK1nxqcl" target="_blank" rel="noopener noreferrer">
        YouTube
        <small>Videos and streams from the channel</small>
      </a>
      <a class="btn" href="https://discord.gg/HqhkhWCZX" target="_blank" rel="noopener noreferrer">Discord</a>
      <a class="btn" href="https://suseowebfreedeltaruneundertale.base44.app" target="_blank" rel="noopener noreferrer">Free Undertale &amp; Deltarune</a>
    </nav>
  </main>
</body>
</html>
